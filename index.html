<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a2238">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Greek Vocab">
  <title>Greek Vocab</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar">
    <h1 id="app-title">Ω Greek Vocab</h1>
    <button id="btn-settings" class="icon-btn" title="Settings">⚙</button>
  </header>

  <main id="view"></main>

  <nav id="tabbar">
    <button data-view="home" class="tab active"><span class="tab-icon">🏠</span>Home</button>
    <button data-view="review" class="tab"><span class="tab-icon">🧠</span>Review</button>
    <button data-view="flash" class="tab"><span class="tab-icon">🃏</span>Cards</button>
    <button data-view="quiz" class="tab"><span class="tab-icon">✅</span>Quiz</button>
    <button data-view="browse" class="tab"><span class="tab-icon">📚</span>Words</button>
  </nav>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
