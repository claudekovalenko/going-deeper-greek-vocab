name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [claude/vocabulary-quiz-pwa-yhgqid]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # enablement:true turns Pages on for the repo if it isn't already,
      # so the site needs no manual setup in repository settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The app is plain static files, so the repo root is the site root.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
