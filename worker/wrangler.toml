name = "greek-vocab-mnemonics"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Secrets are set with `wrangler secret put`, never written in this file:
#   wrangler secret put ANTHROPIC_API_KEY     (required)
